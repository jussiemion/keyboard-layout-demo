olor-scheme: dark)').matches ? 'vesper' : 'vesper_light')\n    : preference;\n  const root = document.documentElement;\n  root.dataset.themePreference = preference;\n  root.dataset.theme = theme;\n  root.classList.toggle('dark', theme === 'vesper');\n})();\n(() =\u003e {\n  const supported = [\"ru\",\"en\",\"pl\",\"fr\",\"de\",\"es\",\"pt\",\"it\",\"ro\",\"he\",\"ar\",\"tr\",\"vi\",\"nl\"];\n  let preference = null;\n  try {\n    const saved = localStorage.getItem('keyboard-layout-demo.ui-locale');\n    if (supported.includes(saved)) preference = saved;\n  } catch {}\n  const languages = navigator.languages?.length ? navigator.languages : [navigator.language];\n  const detected = languages.map(language =\u003e language.toLowerCase().split(/[-_]/)[0].replace(/^iw$/, 'he')).find(language =\u003e supported.includes(language)) || 'en';\n  const route = window.location?.pathname.split('/').filter(Boolean).findLast(part =\u003e supported.includes(part));\n  const explicit = supported.includes(route) ? route : null;\n  const locale = explicit || preference || detected;\n  const root = document.documentElement;\n  root.dataset.keyboardLocale = explicit || detected;\n  root.dataset.uiLocalePreference = preference || 'auto';\n  root.dataset.uiLocale = locale;\n  root.lang = locale;\n  root.dir = ['he', 'ar'].includes(locale) ? 'rtl' : 'ltr';\n  const metadata = {\"ru\":{\"title\":\"Типографская раскладка Семёна Юшкевича\",\"description\":\"Типографская раскладка, клавиатурный тренажёр и справочник символов в браузере. Переключайте базовый и расширенный символьные режимы для ввода знаков пунктуации, валют и других специальных символов.\",\"referenceTitle\":\"Справочник типографики — Типографская раскладка Семёна Юшкевича\",\"referenceDescription\":\"Справочник типографских символов: названия, коды Unicode, кавычки, тире, знаки валют, правила применения и способы ввода с клавиатуры.\"},\"en\":{\"title\":\"Typographic Layout by Semyon Yushkevich\",\"description\":\"A typographic
